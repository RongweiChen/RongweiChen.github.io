<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | 页面不存在</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #f7fbff 0%, #eaf2fb 100%);
            color: #13263f;
            text-align: center;
            padding: 50px 20px;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #1559c1;
            font-family: 'Libre Baskerville', serif;
        }
        p {
            font-size: 1rem;
            margin-bottom: 20px;
        }
        a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            background-color: #1559c1;
            padding: 10px 20px;
            border-radius: 999px;
            transition: background-color 0.3s ease;
            display: inline-block;
            margin: 10px;
        }
        a:hover {
            background-color: #0d428f;
            text-decoration: none;
        }
        .emoji {
            font-size: 6rem;
            margin-bottom: 30px;
            animation: float 3s infinite;
        }
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>
<body>
    <div class="emoji">🤔</div>
    <h1>404</h1>
    <p>这个页面不存在，可能是链接失效，或者页面还没有发布。</p>
    <p><a href="/">返回首页</a></p>
</body>
</html>
